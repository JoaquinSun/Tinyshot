name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public files
        run: python3 scripts/check-public.py --staged
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: zsh scripts/test.sh
      - name: Build application
        run: zsh scripts/build.sh
      - name: Verify universal release package
        run: python3 scripts/package-release.py
